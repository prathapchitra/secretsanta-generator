apiVersion: apps/v1
kind: Deployment
metadata:
  name: santa-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: santa
  template:
    metadata:
      labels:
        app: santa
    spec:
      containers:
        - name: santa
          image: adijaiswal/santa:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: santa-ssvc
spec:
  type: NodePort        # ✅ Required for nodePort
  selector:
    app: santa
  ports:
    - protocol: TCP
      port: 8080         # Service port inside cluster
      targetPort: 8080   # Container port
      nodePort: 32547    # Fixed NodePort (must be inside ports[])
